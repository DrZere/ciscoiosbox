[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciscoiosbox"
version = "0.1.0"
description = "A lightweight WinBox-style desktop manager for Cisco switches and routers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "numpy>=1.24.0",
    "netmiko>=4.3.0",
    "paramiko>=3.4.0",
    "pyserial>=3.5",
    "textfsm>=1.1.3",
    "ntc-templates>=4.0.0",
    "keyring>=24.3.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
snmp = ["pysnmp>=6.1.0"]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pyinstaller>=6.3.0"]

[project.scripts]
ciscoiosbox = "ciscoiosbox.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
